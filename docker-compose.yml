services:
  db:
    image: postgres:16-alpine
    container_name: unicen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-unicen_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend. The entrypoint runs migrations and the idempotent seed before starting the API.
  api:
    build: ./unicen_backend
    container_name: unicen-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-unicen_db}
      TOKEN_PROVIDER: ${TOKEN_PROVIDER:-jwt}
      JWT_SECRET: ${JWT_SECRET:-unicen_dev_secret_change_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/docs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Frontend: static build served by nginx, which proxies /api to the backend.
  web:
    build: ./unicen_frontend
    container_name: unicen-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
    name: unicen_pgdata
